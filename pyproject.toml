[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "composer-rostrum"
version = "0.6.0"
description = "Benchmark and harness for AI agency in music composition and production"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Composer Rostrum contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "lupa>=2.2,<3"]
models = ["openai>=3.17,<4"]

[project.scripts]
rostrum = "composer_rostrum.runner:main"
rostrum-generate = "composer_rostrum.generator:main"
rostrum-generate-symbolic = "composer_rostrum.symbolic_generator:main"
rostrum-generate-multistep = "composer_rostrum.multistep_generator:main"
rostrum-benchmark = "composer_rostrum.benchmark:main"
rostrum-compare = "composer_rostrum.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"composer_rostrum.backends.reaper" = ["bridge/*.lua", "bridge/*.jsfx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["reaper: requires REAPER_EXECUTABLE and a working local REAPER installation"]
